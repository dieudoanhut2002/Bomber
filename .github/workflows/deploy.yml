name: Deploy Bomber Game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt phụ thuộc
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu TypeScript (Strict Typecheck)
        run: npm run typecheck

      - name: Chạy Unit Tests tự động
        run: npm run test

      - name: Build ứng dụng web tĩnh với Vite
        run: npm run build
        env:
          NODE_ENV: production

      - name: Tải lên Artifact cho GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
